[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "shanghai"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

remappings = [
"@openzeppelin/=lib/openzeppelin-contracts/",
"@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
"forge-std/=lib/forge-std/src/"
]


